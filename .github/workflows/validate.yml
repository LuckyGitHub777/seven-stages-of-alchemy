name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.4.0, pinned to an immutable commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0, pinned to an immutable commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Static site validation
        run: python scripts/validate_site.py
      - name: Verify file checksums
        run: sha256sum -c SHA256SUMS.txt
